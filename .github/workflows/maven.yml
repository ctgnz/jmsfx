# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master", "feature/*" ]
  pull_request:
    branches: [ "master", "feature/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Windows and macOS resolve paths case-insensitively, so two index entries differing only by
    # case address the same file and nothing fails locally - no build error, no test failure, and
    # `git status` clean, because the second path stats successfully and its content matches. That
    # is how jmsfx#136's rename put 228 HQTFFD fragments into the index twice, as HQTFFD and
    # Hqtffd, and only a stricter client noticed (jmsfx#150). This runner is case-sensitive, which
    # makes it the cheapest place to catch it.
    - name: No two paths differing only by case
      run: |
        git ls-files > tracked.txt
        tr '[:upper:]' '[:lower:]' < tracked.txt | sort | uniq -d > collisions.txt
        if [ -s collisions.txt ]; then
          echo "::error::the index holds paths differing only by case, which cannot both exist on a case-insensitive filesystem"
          while IFS= read -r lower; do
            awk -v want="$lower" 'tolower($0) == want { print "  " $0 }' tracked.txt
          done < collisions.txt
          rm -f tracked.txt collisions.txt
          exit 1
        fi
        echo "no case-only duplicates among $(wc -l < tracked.txt) tracked paths"
        rm -f tracked.txt collisions.txt

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Install Xvfb
      # JavaFX toolkit startup (e.g. any test that touches Platform) hangs rather than failing fast when no
      # display is available, as on a bare ubuntu-latest runner.
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Build with Maven
      # -Pstandard names a library for the viewer applications, which since jmsfx#112 have no
      # default - naming none is refused rather than producing an application with nothing to
      # render with. CI covers the standard library; the per-library bundles are the release
      # workflow's job.
      run: xvfb-run --auto-servernum mvn -B clean verify -Pstandard
