# Publishes a GitHub Release for a tagged jmsfx version.
#
# Tag a commit whose pom version has had -SNAPSHOT removed everywhere, and whose tag equals that version:
#
#     mvn versions:set -DnewVersion=1.2.0 -DprocessAllModules=true
#     git commit -am "Release 1.2.0"
#     git tag 1.2.0 && git push origin master 1.2.0
#
# processAllModules is not optional, and its absence is what made versions:set look unreliable here. Since
# jmsfx#102 split the parent from the aggregator, no module declares the aggregator as its parent - so the
# default behaviour, which walks the parent chain, changes the aggregator's own version and nothing else, and
# leaves a tree where one pom says 1.2.0 and nine say 1.1.0-SNAPSHOT. Verify before tagging:
#
#     grep -rn "<version>" --include=pom.xml . | grep -v target | grep SNAPSHOT
#
# A tag stages a deployment on the Maven Central Portal and creates a GitHub Release. autoPublish is false in
# the pom, so the Portal holds the staging until someone publishes it deliberately - a bad one is dropped
# rather than superseded. 2.0.0 is the first jmsfx release to reach Central; 1.5.0 and earlier only ever
# produced GitHub Release artifacts.
#
# The four secrets this needs are GPG_PRIVATE_KEY (the armoured secret key, not the public one, and not
# base64-of-binary), GPG_PASSPHRASE, and the Portal user token as CENTRAL_USERNAME and CENTRAL_PASSWORD. The
# 2.0.0 tag failed its first run with "gpg: no default secret key" because the workflow was copied from
# foxglove and the secrets were never created here.

name: Release

# A tag pushed by hand stages the deployment on the Portal for a person to publish. A tag pushed by the
# release train publishes straight through, because the train has already had its approval
# (ctggames/release-train#6). Every tag run, and every rehearsal, lists the files it published or would
# publish as release-artifacts.txt, in the run summary and as a workflow artifact, so the train can
# compare a release with its rehearsal.

# Needed to create the GitHub Release. Since the move into the ctggames organisation the default
# workflow token is read-only, so without this the publish succeeds and then the release call 403s -
# which is how 2.0.1 reached Central with no GitHub Release or desktop bundles. Declared here rather
# than widening the repository-wide setting: it grants the one workflow the one permission, and it
# travels with the file. A re-run uses the workflow at the tagged commit, so this has to be in place
# before a tag, not fixed afterwards (#163).
permissions:
  contents: write

# Can also be run manually from the Actions tab, which builds the platform bundles
# and leaves them as workflow artifacts without creating or touching a release. The
# packaging job runs on three platforms, two of which cannot be tested locally here,
# so being able to exercise it without committing to a tag is worth the few extra
# conditionals below.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "bundles" builds the platform bundles and keeps them as workflow artifacts, without creating or
          touching a release. "rehearse" runs the release build - javadoc, sources and signing - and lists
          what a release would publish, then stops: nothing reaches the Portal and no bundles are built.
        type: choice
        options: [bundles, rehearse]
        default: bundles

jobs:
  build:
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 19 October 2026
    # (actions/runner-images#14748). A release should build on the image it was tested on
    # rather than on whatever the label points at that week; maven.yml stays on the floating
    # label so a new image's problems surface in CI first. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
    # Submodules matter even here: jmsfx-server takes its stylesheet from the brand
    # submodule, and Maven skips a missing resource directory with only a warning -
    # so without this the reactor builds green and silently ships without it.
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        # Writes a settings.xml carrying a 'central' server whose credentials come from the
        # environment, and imports the signing key. The publishing plugin resolves that server
        # before it does anything else, so without it the build fails on a null server rather
        # than on a rejected upload.
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Verify the tag names a release version
      if: github.ref_type == 'tag'
      run: |
        VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1)
        echo "tag:         $GITHUB_REF_NAME"
        echo "pom version: $VERSION"
        case "$VERSION" in
          *-SNAPSHOT)
            echo "::error::pom version $VERSION is a snapshot - remove -SNAPSHOT before tagging a release"
            exit 1
            ;;
        esac
        if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pom version $VERSION"
          exit 1
        fi

    # Tests already ran via maven.yml's own push-to-master trigger, before this commit was ever tagged - no need
    # to run them again here.
    # -Pstandard because jmsfx#112 gives the applications one build product per library and no
    # default - a build naming none is refused by an enforcer rule rather than quietly producing an
    # application with no library in it. The library named here is the one whose artifacts go to
    # Central, which is the standard APP-6E one.
    - name: Build
      if: inputs.mode != 'rehearse'
      run: mvn -B --no-transfer-progress -DskipTests -Pstandard package

    # Everything a release does except the two steps that cannot be undone. install rather than package,
    # so the artifacts land in the local repository in the layout a real release stages them in, for the
    # artifact list below. Tests skipped as in the publish, for the same reason as the build above.
    - name: Rehearse the release build
      if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse'
      run: mvn -B --no-transfer-progress -DskipTests -Pstandard,release install
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    # A tag pushed by the release train has already had its approval, so it publishes straight through and
    # waits until Central reports it published. Any other tag stages a validated deployment for a person to
    # publish in the Portal, as before. The train's bot account is named in the RELEASE_TRAIN_BOT
    # organisation variable; while that is unset, every release stages.
    - name: Decide how the release reaches Central
      id: publish
      if: github.ref_type == 'tag'
      env:
        TRAIN_BOT: ${{ vars.RELEASE_TRAIN_BOT }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$TRAIN_BOT" ] && [ "$GITHUB_ACTOR" = "$TRAIN_BOT" ]; then
          echo "Tag pushed by the release train ($GITHUB_ACTOR): publishing automatically."
          echo "auto=true" >> "$GITHUB_OUTPUT"
          echo "wait=PUBLISHED" >> "$GITHUB_OUTPUT"
        else
          echo "Staging a validated deployment, to be published in the Portal."
          echo "auto=false" >> "$GITHUB_OUTPUT"
          echo "wait=VALIDATED" >> "$GITHUB_OUTPUT"
        fi

    # Tag only: a manual run carries a snapshot version, which the Portal will not take, and
    # publishing is not what a rehearsal is for. autoPublish is false by default, so a tag pushed by
    # hand stages a validated deployment and publishing to Central stays a deliberate click - a bad
    # staging can be dropped rather than having to be superseded. The release train's tags publish
    # straight through (see "Decide how the release reaches Central").
    - name: Publish to the Maven Central Portal
      if: github.ref_type == 'tag'
      # Both profiles: -Prelease alone now fails the enforcer rule, which is the point of it. That
      # is exactly the trap jmsfx#112 describes - naming a profile deactivates an activeByDefault
      # one, so a defaulted library would have silently dropped out here and published an
      # application that starts and then answers 500 to everything.
      run: >-
        mvn -B --no-transfer-progress -DskipTests -Pstandard,release deploy
        -Dcentral.autoPublish=${{ steps.publish.outputs.auto }}
        -Dcentral.waitUntil=${{ steps.publish.outputs.wait }}
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    # The files a release publishes, or a rehearsal would publish, in repository layout without signatures
    # or checksums: what the release train compares with its own rehearsal. A real release lists what the
    # publishing plugin staged; a rehearsal lists what it installed locally. Either way the list holds only
    # this repository's own modules, read from its poms, less any the poms' excludeArtifacts keep off
    # Central: a local repository also holds other ctggames artifacts, from the cache or from a whole-train
    # rehearsal, and a sibling library can share this version number. An empty list fails the step, so a
    # change in either layout cannot pass unnoticed as "nothing to compare".
    - name: List the release artifacts
      if: github.ref_type == 'tag' || inputs.mode == 'rehearse'
      run: |
        VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1)
        GROUP=$(mvn -q -B help:evaluate -Dexpression=project.groupId -DforceStdout 2>/dev/null | tail -n1 | tr . /)
        STAGING=$(find . -type d -path '*/target/central-staging' | head -n1)
        ROOT=${STAGING:-$HOME/.m2/repository}
        MODULES=$(python3 - <<'PY'
        import pathlib, xml.etree.ElementTree as ET
        ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
        modules, excluded = set(), set()
        for pom in pathlib.Path('.').rglob('pom.xml'):
            if 'target' in pom.parts:
                continue
            root = ET.parse(pom).getroot()
            modules.add(root.find('m:artifactId', ns).text)
            excluded.update(e.text for e in root.iter('{%s}excludeArtifact' % ns['m']))
        print('|'.join(sorted(modules - excluded)))
        PY
        )
        echo "Listing $GROUP at $VERSION from $ROOT, for: $MODULES"
        (cd "$ROOT" && find "$GROUP" -type f -path "*/$VERSION/*") \
          | grep -E "^$GROUP/($MODULES)/$VERSION/" \
          | grep -vE '\.(asc|md5|sha1|sha256|sha512)$|/maven-metadata[^/]*$|/_remote\.repositories$|\.lastUpdated$' \
          | sort > release-artifacts.txt || true
        if [ ! -s release-artifacts.txt ]; then
          echo "::error::no artifacts found for $GROUP ($MODULES) at $VERSION under $ROOT"
          exit 1
        fi
        cat release-artifacts.txt
        {
          echo "### Release artifacts: $VERSION"
          echo '```'
          cat release-artifacts.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the artifact list
      if: github.ref_type == 'tag' || inputs.mode == 'rehearse'
      uses: actions/upload-artifact@v7
      with:
        name: release-artifacts
        path: release-artifacts.txt

    # After the publish, so a failed deploy cannot leave a release announcing a version that
    # never reached Central - which is how foxglove's 0.9.5 went wrong.
    - name: Create release
      if: github.ref_type == 'tag'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        # Named rather than globbed. This step runs after the publish, so -Prelease has already
        # built sources, javadoc and jmsfx-core's test jar into the same directories - and those
        # belong on Central, where a build resolves them, not attached here as well. All four
        # libraries, because all four publish.
        artifacts: >-
          jmsfx-core/target/jmsfx-core-${{ github.ref_name }}.jar,
          library/jmsfx-standard/target/jmsfx-standard-${{ github.ref_name }}.jar,
          library/jmsfx-historical/target/jmsfx-historical-${{ github.ref_name }}.jar,
          library/jmsfx-battleorder/target/jmsfx-battleorder-${{ github.ref_name }}.jar
        token: ${{ secrets.GITHUB_TOKEN }}

  # jpackage bundles a Java runtime with the application, and can only produce a
  # bundle for the platform it runs on - hence a job per platform rather than one
  # cross-compiling. Maven resolving JavaFX's native classifier from the build host
  # works in our favour here: each runner picks up its own platform's natives.
  package:
    name: Package (${{ matrix.library }}, ${{ matrix.target.platform }})
    needs: build
    # A rehearsal proves the release build, not the bundles; "bundles" is the mode that builds them.
    if: inputs.mode != 'rehearse'
    strategy:
      # One combination failing should not deny the others their artifacts.
      fail-fast: false
      # A genuine cross product: every library on every platform, which is what jmsfx#112 means by
      # one build product per library. Three libraries by three platforms, nine jobs. jmsfx-battleorder
      # joined at 2.0.0: it was held out while it could not draw, and the jmsfx#82 epic settled how a
      # library gets its fragments, so it now renders through the tree it extends (jmsfx#133).
      matrix:
        library:
          - standard
          - historical
          - battleorder
        target:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          # Pinned, and this is the one that matters most: jpackage links the launcher it
          # produces against the build host's glibc, so building on a newer image raises the
          # minimum glibc of every machine that can run the Linux bundle. Moving that is a
          # decision about who can run the download, not a housekeeping detail.
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.target.os }}
    steps:
    # The brand submodule feeds jmsfx-server's stylesheet. Maven skips a missing
    # resource directory with only a warning, so without this the reactor builds
    # green and silently ships without it.
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Work out the version being packaged
      shell: bash
      # A tag names the version directly; a manual run takes whatever the poms say,
      # snapshot suffix and all, since nothing is being published.
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME}"
        else
          VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1)
        fi
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "packaging version ${VERSION}"

    - name: Build jmsfx-creator and collect its dependencies
      shell: bash
      run: mvn -B --no-transfer-progress -DskipTests -P${{ matrix.library }} -pl :jmsfx-creator -am package

    - name: Stage the application jar alongside its dependencies
      shell: bash
      # jpackage reads one input directory and resolves --main-jar inside it, so the
      # application's own jar has to sit with the dependencies rather than above them.
      run: cp jmsfx-viewer/jmsfx-creator/target/jmsfx-creator-*.jar jmsfx-viewer/jmsfx-creator/target/lib/

    - name: Build the application image
      shell: bash
      run: |
        jpackage \
          --type app-image \
          --name "JMSFX Icon Creator" \
          --app-version "${VERSION%-SNAPSHOT}" \
          --vendor "CTG Games Limited" \
          --input jmsfx-viewer/jmsfx-creator/target/lib \
          --main-jar "jmsfx-creator-${VERSION}.jar" \
          --main-class io.github.ctgnz.jmsfx.icon.creator.IconCreatorLauncher \
          --dest jmsfx-viewer/jmsfx-creator/target/dist \
          --java-options "--enable-native-access=ALL-UNNAMED"

    - name: Check the image looks complete
      shell: bash
      # A headless runner cannot confirm the application renders correctly. This only
      # establishes that jpackage produced a launcher and brought the jars along.
      # The layout differs per platform - Windows puts the launcher beside the app
      # directory, Linux under bin/, and macOS inside a .app bundle - so each path
      # is named explicitly. Searching by name matched the bundled icon instead,
      # and so reported success without a launcher being present at all.
      run: |
        cd jmsfx-viewer/jmsfx-creator/target/dist
        ls -la . | sed 's/^/  /'
        find . -name "*.jar" | wc -l | xargs echo "jars in image:"
        case "${{ matrix.target.platform }}" in
          windows) LAUNCHER="JMSFX Icon Creator/JMSFX Icon Creator.exe" ;;
          linux)   LAUNCHER="JMSFX Icon Creator/bin/JMSFX Icon Creator" ;;
          macos)   LAUNCHER="JMSFX Icon Creator.app/Contents/MacOS/JMSFX Icon Creator" ;;
        esac
        test -f "$LAUNCHER" || { echo "::error::no launcher at $LAUNCHER"; exit 1; }
        echo "launcher: $LAUNCHER"

    - name: Smoke test that it starts
      # Only Linux can do this: a virtual display is available there, where the Windows
      # and macOS runners cannot be relied on to have an interactive session. So macOS
      # in particular ships without ever having been seen to run - see issue #41.
      if: matrix.target.platform == 'linux'
      run: |
        sudo apt-get update && sudo apt-get install -y xvfb
        cd "jmsfx-viewer/jmsfx-creator/target/dist/JMSFX Icon Creator/bin"
        xvfb-run -a timeout 30 ./"JMSFX Icon Creator" > launch.log 2>&1 || true
        cat launch.log
        if grep -qE "Exception|Error:" launch.log; then
          echo "::error::the application reported an error on startup"
          exit 1
        fi

    - name: Archive the image
      shell: bash
      run: |
        cd jmsfx-viewer/jmsfx-creator/target/dist
        # library then platform, matching CreatorDownloads in jmsfx-server - the download page
        # builds these names to link to, and nothing checks that the two agree, so
        # CreatorDownloadsTest spells them out in full.
        ARCHIVE="jmsfx-creator-${VERSION}-${{ matrix.library }}-${{ matrix.target.platform }}"
        case "${{ matrix.target.platform }}" in
          linux)
            tar czf "../${ARCHIVE}.tar.gz" "JMSFX Icon Creator"
            ;;
          macos)
            # ditto rather than zip: a .app is a bundle, and zip does not reliably
            # preserve the symlinks and permission bits that make it launchable.
            ditto -c -k --sequesterRsrc --keepParent "JMSFX Icon Creator.app" "../${ARCHIVE}.zip"
            ;;
          windows)
            7z a "../${ARCHIVE}.zip" "JMSFX Icon Creator" > /dev/null
            ;;
        esac
        ls -lh ../jmsfx-creator-*.* | sed 's/^/  /'

    - name: Keep the bundles when run manually
      if: github.ref_type != 'tag'
      uses: actions/upload-artifact@v7
      with:
        name: jmsfx-creator-${{ matrix.library }}-${{ matrix.target.platform }}
        path: |
          jmsfx-viewer/jmsfx-creator/target/jmsfx-creator-*.zip
          jmsfx-viewer/jmsfx-creator/target/jmsfx-creator-*.tar.gz

    - name: Attach to the release
      if: github.ref_type == 'tag'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        artifacts: "jmsfx-viewer/jmsfx-creator/target/jmsfx-creator-*.zip,jmsfx-viewer/jmsfx-creator/target/jmsfx-creator-*.tar.gz"
        token: ${{ secrets.GITHUB_TOKEN }}
