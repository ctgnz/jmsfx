<!doctype html>
<html th:replace="~{layout :: layout(~{::title}, 'browse', ~{::#content}, ~{::script})}">
    <head>
        <title>JMSFX | Browse Symbol Sets</title>
        <script type="text/javascript">
function showError(message) {
	$('#page-alert').text(message)
		.removeClass('d-none');
}

function hideError() {
	$('#page-alert').addClass('d-none');
}

$(document).ready(function() {
	hideError();
	$.getJSON('/info/symbols', function(data) {
		var select = $("#symbol-sets");
		select.empty();
		select.append('<option value="" selected>Select symbol set</option>');
		$.each(data, function(ix, symbol) {
			select.append($('<option>', {
				value: symbol.id,
				text: symbol.label
			}));
		});
	}).fail(function () {
		showError('Failed to load the list of symbol sets - check the server connection and reload the page.');
	});
	// Delegated, because the tree is replaced wholesale every time a symbol set is chosen -
	// a handler bound to the buttons themselves would be thrown away with the old content.
	$('#entities').on('click', '.tree-toggle', function () {
		$('#entities .col-md-6 details').prop('open', $(this).data('open'));
	});
	$('#symbol-sets').change(function () {
		hideError();
		var opt = $('#symbol-sets option:selected');
    	var url = '/browse/' + opt.val();
    	$('#browse-spinner').removeClass('d-none');
        $.get(url, function(data) {
            $('#entities').html(data);
            // Tooltips attach per element, so they have to be created again each time the
            // tree is replaced. Without this the buttons still show the browser's own title
            // tooltip, so the label is never lost - it just looks less like the rest of the UI.
            $('#entities [data-bs-toggle="tooltip"]').each(function () {
                new bootstrap.Tooltip(this);
            });
        }).fail(function () {
        	showError('Failed to load the entities for ' + opt.text() + '.');
        }).always(function () {
        	$('#browse-spinner').addClass('d-none');
        });
	});
});
        </script>
    </head>
    <body>
        <div id="content">
            <div id="page-alert" class="alert alert-danger d-none" role="alert"></div>
            <form>
                <div class="d-flex mb-2 align-items-center">
                    <label for="symbol-sets" class="col-sm-2 col-form-label">Symbol Set:</label>
                    <select id="symbol-sets" class="col-sm-4 col-form-select" aria-label="Symbol Set">
                        <option>Select symbol set</option>
                    </select>
                    <div id="browse-spinner" class="spinner-border spinner-border-sm ms-3 d-none" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </form>
            <div id="entities">
                <p class="mt-3">Select the required symbol set to view the entities, types and sub-types for that set.</p>
            </div>
            <div th:if="${symbolSet}" th:fragment="entities">
                <h5 class="p-3" th:text="${symbolSet.label}">Symbol Set</h5>
                <div class="row">
                    <div class="col-md-6">
                        <div class="tree-header">
                            <h5 class="mb-0">Main Sector Icons</h5>
                            <div class="btn-group btn-group-sm" role="group" aria-label="Expand or collapse the whole tree">
                                <!-- Icon only, with the name as a tooltip. The glyphs are the familiar
                                     box-and-plus / box-and-minus of a tree control, drawn inline so they
                                     take their colour from the button and stay crisp at any display scale -
                                     the same approach the tree's own chevron already uses. -->
                                <button type="button" class="btn btn-outline-secondary tree-toggle" data-open="true"
                                        title="Expand all" aria-label="Expand all" data-bs-toggle="tooltip">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                         fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
                                        <rect x="2.75" y="2.75" width="10.5" height="10.5" rx="1.5"/>
                                        <path d="M8 5.25v5.5M5.25 8h5.5"/>
                                    </svg>
                                </button>
                                <button type="button" class="btn btn-outline-secondary tree-toggle" data-open="false"
                                        title="Collapse all" aria-label="Collapse all" data-bs-toggle="tooltip">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                         fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
                                        <rect x="2.75" y="2.75" width="10.5" height="10.5" rx="1.5"/>
                                        <path d="M5.25 8h5.5"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <ul class="tree-view">
                            <li th:each="entity : ${symbolSet.entities}">
                                <details th:unless="${#lists.isEmpty(entity.entityTypes)}">
                                    <summary>
                                        <img class="jms-icon" th:attr="src='/' + ${symbolSetPath} + '/symbol/entity/'+${entity.name()}+'?trim=true',alt='Icon for entity ' + ${entity.label}" />
                                        <span class="entity" th:text="${entity.label}"></span>
                                    </summary>
                                    <ul>
                                        <li th:each="entityType : ${entity.entityTypes}">
                                            <details th:unless="${#lists.isEmpty(entityType.entitySubTypes)}">
                                                <summary>
                                                    <img class="jms-icon" th:attr="src='/' + ${symbolSetPath} + '/symbol/'+${entityType.name()}+'?trim=true',alt='Icon for entity type ' + ${entityType.label}" />
                                                    <span class="entity-type" th:text="${entityType.label}"></span>
                                                </summary>
                                                <ul>
                                                    <li th:each="entitySubType : ${entityType.entitySubTypes}" class="tree-leaf has-spacer">
                                                        <img class="jms-icon" th:attr="src='/' + ${symbolSetPath} + '/symbol/'+${entityType.name()}+'/'+${entitySubType.name()}+'?trim=true',alt='Icon for ' + ${entitySubType.label}" />
                                                        <span th:text="${entitySubType.label}" class="entity-subtype">Entity Sub Type</span>
                                                    </li>
                                                </ul>
                                            </details>
                                            <div th:if="${#lists.isEmpty(entityType.entitySubTypes)}" class="tree-leaf has-spacer">
                                                <img class="jms-icon" th:attr="src='/' + ${symbolSetPath} + '/symbol/'+${entityType.name()}+'?trim=true',alt='Icon for entity type ' + ${entityType.label}" />
                                                <span class="entity-type" th:text="${entityType.label}"></span>
                                            </div>
                                        </li>
                                    </ul>
                                </details>
                                <div th:if="${#lists.isEmpty(entity.entityTypes)}" class="tree-leaf has-spacer">
                                    <img class="jms-icon" th:attr="src='/' + ${symbolSetPath} + '/symbol/entity/'+${entity.name()}+'?trim=true',alt='Icon for entity ' + ${entity.label}" />
                                    <span class="entity" th:text="${entity.label}"></span>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div th:unless="${#lists.isEmpty(symbolSet.sectorOneModifiers)}" class="col-md-3">
                        <div class="tree-header">
                            <h5 class="mb-0">Sector One Modifiers</h5>
                        </div>
                        <ul class="tree-view">
                            <li class="tree-leaf" th:each="sectorOneMod : ${symbolSet.sectorOneModifiers}">
                                <img class="jms-icon" alt="Icon for ${sectorOneMod.label}" th:attr="src='/' + ${symbolSetPath} + '/symbol/modifier/one/'+${sectorOneMod.name()}+'?trim=true'" />
                                <span th:text="${sectorOneMod.label}" class="entity">Sector One Modifier</span>
                            </li>
                        </ul>
                    </div>
                    <div th:unless="${#lists.isEmpty(symbolSet.sectorTwoModifiers)}" class="col-md-3">
                        <div class="tree-header">
                            <h5 class="mb-0">Sector Two Modifiers</h5>
                        </div>
                        <ul class="tree-view">
                            <li class="tree-leaf" th:each="sectorTwoMod : ${symbolSet.sectorTwoModifiers}">
                                <img class="jms-icon" alt="Icon for ${sectorTwoMod.label}" th:attr="src='/' + ${symbolSetPath} + '/symbol/modifier/two/'+${sectorTwoMod.name()}+'?trim=true'" />
                                <span th:text="${sectorTwoMod.label}" class="entity">Sector Two Modifier</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
