amplifiers:
- {id: "A", type: GRAPHIC, code: "SymbolIcon", label: "Symbol Icon", description: The innermost part of a symbol that represents a joint military object.}
- {id: "B", type: GRAPHIC, code: "Echelon", label: "Echelon", description: A graphic amplifier in a unit symbol that identifies command level.}
- {id: "C", type: ALPHANUMERIC, min: 1, max: 19, code: "Quantity", label: "Quantity", description: A text amplifier in an equipment symbol that identifies the number of items present.}
- {id: "D", type: GRAPHIC, code: "TaskForceIndicator", label: "Task Force Indicator", description: A graphic amplifier that identifies a unit or stability operations symbol as a task force.}
- {id: "F", type: LIST, min: 1, max: 1, code: "ReinforcedOrReduced", label: "Reinforced or Reduced", description: "A text amplifier in a unit symbol that dispays (+) for reinforced, (-) for reduced, (±) for reinforced and reduced."}
- {id: "G", type: ALPHANUMERIC, min: 1, max: 20, code: "StaffComments", label: "Staff Comments", description: "A text amplifier for units, equipment, and installations."}
- {id: "H", type: ALPHANUMERIC, min: 1, max: 20, code: "AdditionalInformation", label: "Additional Information", description: "A text amplifier for units, equipment, and installations."}
- {id: "H1", type: ALPHANUMERIC, min: 1, max: 3, code: "UnlistedPointInformation", label: "Unlisted Point Information", description: A text amplifier used to provide an up to a three-character letter field acronym to describe a point that is not already listed.}
- {id: "J", type: LIST, min: 2, max: 2, code: "EvaluationRating", label: "Evaluation Rating", description: "A text amplifier for units, equipment and installations that consists of a one-letter reliability rating and a one-number credibility rating."}
- {id: "K", type: LIST, min: 2, max: 3, code: "CombatEffectiveness", label: "Combat Effectiveness", description: A text amplifier for units and installations that indicates unit effectiveness or installation capability.}
- {id: "L", type: ALPHANUMERIC, min: 1, max: 1, code: "SignatureEquipment", label: "Signature Equipment", description: "A text amplifier for hostile equipment, '!' indicates detectable electronic signatures."}
- {id: "M", type: ALPHANUMERIC, min: 1, max: 21, code: "HigherFormation", label: "Higher Formation", description: A text amplifier for units that indicates number or title of higher echelon command (corps are designated by Roman numerals).}
- {id: "N", type: ALPHA, code: "HostileEnemy", label: "Hostile (Enemy)", description: "A text amplifier for equipment, letters 'ENY' denote hostile symbols."}
- {id: "P", type: ALPHANUMERIC, min: 8, max: 17, code: "IffSifAis", label: "IFF/SIF/AIS", description: A text amplifier displaying IFF/SIF/AIS identification modes and codes.}
- {id: "Q", type: GRAPHIC, code: "DirectionOfMovementIndicator", label: "Direction of Movement Indicator", description: A graphic amplifier for units and equipment that identifies the direction of movement or intended movement of an object.}
- {id: "R", type: GRAPHIC, code: "MobilityIndicator", label: "Mobility Indicator", description: A graphic amplifier for units and equipment that identifies the direction of movement or intended movement of an object.}
- {id: "R2", type: LIST, min: 1, max: 1, code: "SigintMobilityIndicator", label: "SIGINT Mobility Indicator", description: "M=Mobile, S=Static, or U=Uncertain"}
- {id: "S", type: GRAPHIC, code: "HeadquartersStaffIndicator", label: "Headquarters Staff Indicator", description: "A graphic amplifier for units, equipment and installations that identifies a unit as a headquarters."}
- {id: "S2", type: GRAPHIC, code: "OffsetLocationIndicator", label: "Offset Location Indicator", description: "A graphic amplifier for units, equipment and installations used when placing an object away from its actual location."}
- {id: "T", type: ALPHANUMERIC, min: 1, max: 30, code: "UniqueDesignation", label: "Unique Designation", description: "A text amplifier for units, equipment and installations that uniquely identifies a particular symbol or track number."}
- {id: "T1", type: ALPHANUMERIC, min: 1, max: 30, code: "UniqueIdentifierPrimaryPurpose", label: "Unique Identifier/Primary Purpose", description: "A text amplifier for units, equipment and installations that uniquely identifies a particular symbol or track number."}
- {id: "T2", type: ALPHANUMERIC, min: 1, max: 7, code: "ControllingHeadquarters", label: "Controlling Headquarters", description: An amplifier used to provide the designation of the Establishing Headquarters for Fire Support Control Measures only.}
- {id: "V", type: ALPHANUMERIC, min: 1, max: 24, code: "TypeOfEquipment", label: "Type of Equipment", description: A text amplifier for equipment that indicates types of equipment.}
- {id: "W", type: ALPHANUMERIC, min: 3, max: 16, code: "DateTimeGroupDtg", label: "Date/Time Group (DTG)", description: An alphanumeric designator for displaying a date-time group (DDHHMMSSZMONYYYY) or O/O for on order.}
- {id: "W1", type: ALPHANUMERIC, min: 3, max: 16, code: "DateTimeGroupDtgPeriod", label: "Date/Time Group (DTG) (Period)", description: An alphanumeric designator for displaying a date-time group (DDHHMMSSZMONYYYY) or O/O for on order.}
- {id: "X", type: ALPHANUMERIC, min: 2, max: 14, code: "AltitudeDepth", label: "Altitude/Depth", description: "A text amplifier for units, equipment, and installations that displays either altitude, flight level, depth for submerged objects."}
- {id: "Y", type: ALPHANUMERIC, min: 12, max: 22, code: "Location", label: "Location", description: "A text amplifier for units, equipment, and installations that displays a symbol's location in degrees, minutes, and decimal minutes."}
- {id: "YP", type: ALPHANUMERIC, min: 22, max: 22, code: "SymbolReferencesPoints", label: "Symbol References Points", description: "An exchange only amplifier that is repeated as YP, YP1, YP2 to represent the reference points of symbols. Note that these reference points are indicated as centre point, PT 1, PT 2, etc. in the symbol diagram templates and not as YP."}
- {id: "Z", type: LIST, min: 5, max: 9, code: "Speed", label: "Speed", description: A text amplifier for units and equipment that displays velocity as set forth in MIL-STD 6040.}
- {id: "AA", type: ALPHANUMERIC, min: 1, max: 9, code: "NamedC2Headquarters", label: "Named C2 Headquarters", description: A text modifier for units; indicator is contained inside the frame; contains the name of the special C2 Headquarters.}
- {id: "AB", type: GRAPHIC, code: "FeintDummyIndicator", label: "Feint/Dummy Indicator", description: "A graphic amplifier for units, equipment and installations that identifies an offensive or defensive unit intended to draw the enemy's attention away from the area of the main attack."}
- {id: "AD", type: LIST, min: 5, max: 5, code: "PlatformType", label: "Platform Type", description: Electronic Intelligence Notation (ELNOT) or Communications Intelligence Notation (CENOT)}
- {id: "AE", type: NUMERIC, min: 1, max: 3, code: "EquipmentTeardownTime", label: "Equipment Teardown Time", description: Equipment teardown time in minutes}
- {id: "AF", type: ALPHANUMERIC, min: 1, max: 12, code: "CommonIdentifier", label: "Common Identifier", description: "Example: 'Hawk' for Hawk SAM system"}
- {id: "AG", type: GRAPHIC, code: "AuxiliaryEquipmentIndicator", label: "Auxiliary Equipment Indicator", description: A graphic modifier for equipment that indicates the presence of a towed sonar array.}
- {id: "AH", type: GRAPHIC, min: 1, max: 6, code: "AreaOfUncertaintyIndicator", label: "Area of Uncertainty Indicator", description: "A graphic modifier for units, equipment and installations that indicates the area where an object is most likely to be, based on the object's last report and the reporting accuracty of the sensor that detected the object."}
- {id: "AH1", type: GRAPHIC, min: 1, max: 6, code: "AreaOfUncertaintyIndicatorLongitude", label: "Area of Uncertainty Indicator Longitude", description: "If AH1 is defined, the value of AH is the latitude radius of uncertainty and AH1 is the longitude radius of uncertainty in metres."}
- {id: "AI", type: GRAPHIC, code: "DeadReckoningTrailer", label: "Dead Reckoning Trailer", description: "A graphic amplifier for units and equipment that identifies where an object should be located at present, given its last reported course and speed."}
- {id: "AJ", type: GRAPHIC, code: "SpeedLeader", label: "Speed Leader", description: "A graphic amplifier for units, equipment and installations that depicts the speed and direction of movement of an object."}
- {id: "AK", type: GRAPHIC, code: "PairingLine", label: "Pairing Line", description: "A graphic amplifier for units, equipment and installations that connects two objects and is updated dynamically as the positions of the objects change."}
- {id: "AL", type: GRAPHIC, code: "OperationalCondition", label: "Operational Condition", description: A graphic amplifier for equipment or installations that indicates operational condition or capacity.}
- {id: "AM", type: ALPHANUMERIC, min: 3, max: 9, code: "Distance", label: "Distance", description: "A numeric amplifier that displays a minimum, maximum, or a specific distance (range, radius, width, length, etc.), in meters."}
- {id: "AN", type: ALPHANUMERIC, min: 7, max: 8, code: "Azimuth", label: "Azimuth", description: A numeric amplifier that displays an angle measured from true north to any other line in degrees.}
- {id: "AO", type: LIST, min: 6, max: 10, code: "EngagementBar", label: "Engagement Bar", description: "An amplifier placed immediately atop the symbol. May denote, 1) local/remote status; 2) engagement status; and 3) weapon type. Format A:BBB-CC"}
- {id: "AO1", type: LIST, code: "TargetDesignation", label: "Target Designation", description: "An amplifier placed immediately atop the symbol. Indicates if the symbol is: Hostile Target/Hostile Non-Target/Expired"}
- {id: "AP", type: ALPHANUMERIC, min: 6, max: 6, code: "TargetNumber", label: "Target Number", description: "A six character text modifier used in Fire Support operations to uniquely designate targets in accordance with STANAG 2484, where characters 1 and 2 are alphabetic, and characters 3-6 are numeric: AANNNN"}
- {id: "AP1", type: NUMERIC, min: 2, max: 3, code: "TargetNumberExtension", label: "Target Number Extension", description: "A 2-3 character amplifier. A target number extension is a sequentially assigned number identifying the individual elements in a target, where character 1 is a dash and characters 2-3 are numeric, from 1 through 15. It is applicable only to the Point or Single Target symbol and is conditional upon the presence of the Target Number amplifier and is visually\
    \ displayed appended to the Target Number amplifier."}
- {id: "AQ", type: ALPHANUMERIC, min: 2, max: 2, code: "GuardedUnit", label: "Guarded Unit", description: "During ballistic missile defense, some tracks are designated as guarded by a particular unit."}
- {id: "AR", type: ALPHANUMERIC, min: 3, max: 3, code: "SpecialDesignator", label: "Special Designator", description: Special track designators such as Non-Real Time (NRT) and Tactically Significant (SIG) tracks are denoted here.}
- {id: "AS", type: LIST, min: 3, max: 3, code: "Country", label: "Country", description: Identifies the country of the organization being shown.}
- {id: "AT", type: ALPHANUMERIC, min: 2, max: 19, code: "CapacityOfInstallation", label: "Capacity of Installation", description: Capacity of Installation displayed.}
- {id: "AV", type: GRAPHIC, code: "LeadershipIdentifier", label: "Leadership Identifier", description: A graphic amplifier that identifies the leadership role for a dismounted individual.}
- {id: "AW", type: ALPHANUMERIC, min: 1, max: 8, code: "HeadquartersElement", label: "Headquarters Element", description: "A text modifier for units, equipment and installations that indicates what type of element of a headquarters is being represented, such as TOC, MAIN."}
- {id: "AX", type: LIST, min: 3, max: 7, code: "InstallationComposition", label: "Installation Composition", description: "Indicates the component type of the installation: Development/Research/Production/Service/Storage/Utility."}
- {id: "AY", type: ALPHANUMERIC, min: 1, max: 40, code: "NetworkIdentifier", label: "Network Identifier", description: Indicates the network the entity has privileges within.}
- {id: "AZ", type: GRAPHIC, code: "Overlay", label: "Overlay", description: An additional graphic overlaid over the whole icon coordinate space.}
