<!doctype html>
<html th:replace="~{layout :: layout(~{::title}, 'generate', ~{::#content}, ~{::script})}">
<head>
    <title>JMSFX | Generate Icons</title>
    <script type="text/javascript">
var symbolSet, entity, entityType, entitySubType, modOne, modTwo, amplifier;
var previewRequest, previewSpinnerTimeout;
var lastSymbolUrl, lastSymbolData;

function showError(message) {
	$('#page-alert').text(message)
		.removeClass('d-none');
}

function hideError() {
	$('#page-alert').addClass('d-none');
}

function stripUnspecified(data) {
	return $.grep(data, function (item) {
		return item.id !== '00';
	});
}

$(document).ready(function () {
	hideError();
	$.getJSON('/info/symbols', function (data) {
		var select = $("#symbol-set");
		select.empty();
		select.append('<option value="" selected>Select symbol set</option>');
		$.each(data, function(ix, symbol) {
			var opt = $('<option>', {
				value: symbol.path,
				text: symbol.label
			})
			select.append(opt);
		});
    }).fail(function () {
    	showError('Failed to load the list of symbol sets - check the server connection and reload the page.');
    });
	$('#symbol-set').change(function () {
		$('#preview').html('');
		hideError();
		var opt = $('#symbol-set option:selected');
		symbolSet = opt.val();
		entity = entityType = entitySubType = modOne = modTwo = amplifier = '';
		$("#entity").empty();
		$("#entity-type").empty();
		$("#entity-subtype").empty();
		$("#modifier-one").empty();
		$("#modifier-two").empty();
		$("#amplifier").empty();
		$.get(symbolSet + '/entity/list', function (data) {
    		var select = $("#entity");
    		select.empty();
    		select.append('<option value="" selected>Unspecified</option>');
    		$.each(stripUnspecified(data), function(ix, entity) {
    			var opt = $('<option>', {
    				value: entity.name,
    				text: entity.label
    			})
    			select.append(opt);
    		});
    		entity = '';
    		updatePreview();
		}).fail(function () {
			showError('Failed to load the entity list for ' + symbolSet + '.');
		});
		$.get(symbolSet + '/modifier/one', function (data) {
    		var select = $("#modifier-one");
    		select.empty();
    		select.append('<option value="" selected>Unspecified</option>');
    		if (data.length == 0) {
    			select.attr('disabled', 'disabled');
    		} else {
    			select.removeAttr('disabled');
    		}
    		$.each(stripUnspecified(data), function(ix, mod) {
    			var opt = $('<option>', {
    				value: mod.name,
    				text: mod.label
    			})
    			select.append(opt);
    		});
		}).fail(function () {
			showError('Failed to load Modifier One options for ' + symbolSet + '.');
		});
		$.get(symbolSet + '/modifier/two', function (data) {
    		var select = $("#modifier-two");
    		select.empty();
    		select.append('<option value="" selected>Unspecified</option>');
    		if (data.length == 0) {
    			select.attr('disabled', 'disabled');
    		} else {
    			select.removeAttr('disabled');
    		}
    		$.each(stripUnspecified(data), function(ix, mod) {
    			var opt = $('<option>', {
    				value: mod.name,
    				text: mod.label
    			})
    			select.append(opt);
    		});
		}).fail(function () {
			showError('Failed to load Modifier Two options for ' + symbolSet + '.');
		});
		$.get(symbolSet + '/amplifier', function (data) {
    		var select = $("#amplifier");
    		select.empty();
			select.append('<option value="" selected>Unspecified</option>');
    		if (data.length == 0) {
    			select.attr('disabled', 'disabled');
    		} else {
    			select.removeAttr('disabled');
    		}
    		$.each(stripUnspecified(data), function(ix, amp) {
    			var opt = $('<option>', {
    				value: amp.name,
    				text: amp.label
    			})
    			select.append(opt);
    		});
		}).fail(function () {
			showError('Failed to load the amplifier list for ' + symbolSet + '.');
		});
	});
	$('#entity').change(function () {
		hideError();
		var opt = $('#entity option:selected');
		entity = opt.val();
		entityType = entitySubType = ''
		if (entity === '') {
			$('#entity-type').empty()
				.attr('disabled', 'disabled');
			$('#entity-subtype').empty()
				.attr('disabled', 'disabled');
			updatePreview();
			return;
		}
		$.get(symbolSet + '/entityType/' + entity + '/list', function (data) {
    		var select = $("#entity-type");
    		select.empty();
    		if (data.length == 0) {
    			select.attr('disabled', 'disabled');
    			$('#entity-subtype').attr('disabled', 'disabled');
    		} else {
    			select.append('<option value="" selected>Unspecified</option>');
    			select.removeAttr('disabled');
    		}
    		$.each(stripUnspecified(data), function(ix, entityType) {
    			var opt = $('<option>', {
    				value: entityType.name,
    				text: entityType.label
    			})
    			select.append(opt);
    		});
		}).fail(function () {
			showError('Failed to load entity types for ' + entity + '.');
		});
		updatePreview();
	});
	$('#entity-type').change(function () {
		hideError();
		var opt = $('#entity-type option:selected');
		entityType = opt.val();
		entitySubType = ''
		if (entityType === '') {
    		var select = $("#entity-subtype");
    		select.empty();
			select.append('<option value="" selected>Unspecified</option>');
		} else {
    		$.get(symbolSet + '/entitySubType/' + entityType + '/list', function (data) {
        		var select = $("#entity-subtype");
        		select.empty();
        		if (data.length == 0) {
        			select.attr('disabled', 'disabled');
        		} else {
        			select.append('<option value="" selected>Unspecified</option>');
        			select.removeAttr('disabled');
        		}
        		$.each(stripUnspecified(data), function(ix, entitySubType) {
        			var opt = $('<option>', {
        				value: entitySubType.name,
        				text: entitySubType.label
        			})
        			select.append(opt);
        		});
    		}).fail(function () {
    			showError('Failed to load entity sub-types for ' + entityType + '.');
    		});
		}
		updatePreview();
	});
	$('#entity-subtype').change(function () {
		var opt = $('#entity-subtype option:selected');
		entitySubType = opt.val();
		updatePreview();
	});
	$('#modifier-one').change(function () {
		var opt = $('#modifier-one option:selected');
		modOne = opt.val();
		updatePreview();
	});
	$('#modifier-two').change(function () {
		var opt = $('#modifier-two option:selected');
		modTwo = opt.val();
		updatePreview();
	});
	$('#amplifier').change(function () {
		var opt = $('#amplifier option:selected');
		amplifier = opt.val();
		updatePreview();
	});
	$('#export-size').change(function () {
		updateExportLinks();
	});
});

function updateExportLinks() {
	if (!lastSymbolUrl) {
		return;
	}
	var svgParams = $.param(lastSymbolData);
	$('#export-svg').attr('href', lastSymbolUrl + (svgParams ? '?' + svgParams : ''))
		.removeClass('disabled');
	var pngParams = $.param($.extend({}, lastSymbolData, { pngWidth: $('#export-size').val() }));
	$('#export-png').attr('href', lastSymbolUrl + '?' + pngParams)
		.removeClass('disabled');
}

function updatePreview() {
	var symbolUrl = symbolSet + '/symbol';
	if (entity) {
    	if (entityType === "") {
    		symbolUrl += '/entity/' + entity;
    	} else {
    		symbolUrl += '/' + entityType;
    		if (entitySubType) {
    			symbolUrl += '/' + entitySubType;
    		}
    	}
	}
	var symbolData = {};
	if (modOne) {
		symbolData['sectorOneMod'] = modOne;
	}
	if (modTwo) {
		symbolData['sectorTwoMod'] = modTwo;
	}
	if (amplifier) {
		symbolData['amplifier'] = amplifier;
	}
	lastSymbolUrl = symbolUrl;
	lastSymbolData = symbolData;
	clearTimeout(previewSpinnerTimeout);
	if (previewRequest) {
		previewRequest.abort();
	}
	previewSpinnerTimeout = setTimeout(function () {
		$('#preview-spinner').removeClass('d-none');
	}, 300);
	previewRequest = $.get({
		url: symbolUrl,
		data: symbolData,
		dataType: "html",
		success: function (data) {
			$('#preview').html(data);
			$('#preview').attr('src', this.url);
            $('#preview-link').attr('href', this.url);
            $title = $(data).find("svg\\:title");
			$('#preview-caption').html($title.text());
			updateExportLinks();
		},
		error: function (jqXHR, textStatus) {
			if (textStatus === 'abort') {
				return;
			}
			showError('Failed to generate the icon preview.');
		},
		complete: function () {
			clearTimeout(previewSpinnerTimeout);
			$('#preview-spinner').addClass('d-none');
		}
	});
}
	</script>
</head>
<body>
    <div id="content">
        <h5 class="py-3">JMSFX Icon Generator</h5>
        <div id="page-alert" class="alert alert-danger d-none" role="alert"></div>
        <div class="row">
            <div id="controls" class="col-md-4">
                <form>
                    <div class="d-flex mb-2">
                        <label for="symbol-set" class="col-sm-4 col-form-label">Symbol Set:</label>
                        <select id="symbol-set" class="col-sm-8 col-form-select" aria-label="Symbol Set">
                            <option>Select symbol set</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="entity" class="col-sm-4 col-form-label">Entity:</label>
                        <select id="entity" class="col-sm-8 col-form-select" aria-label="Entity">
                            <option>Unspecified</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="entity-type" class="col-sm-4 col-form-label">Entity Type:</label>
                        <select id="entity-type" class="col-sm-8 col-form-select" aria-label="Entity Type">
                            <option>Unspecified</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="entity-subtype" class="col-sm-4 col-form-label">Entity Sub-Type:</label>
                        <select id="entity-subtype" class="col-sm-8 col-form-select" aria-label="Entity Sub-Type">
                            <option>Unspecified</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="modifier-one" class="col-sm-4 col-form-label">Modifier One:</label>
                        <select id="modifier-one" class="col-sm-8 col-form-select" aria-label="Modifier One">
                            <option>Unspecified</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="modifier-two" class="col-sm-4 col-form-label">Modifier Two:</label>
                        <select id="modifier-two" class="col-sm-8 col-form-select" aria-label="Modifier Two">
                            <option>Unspecified</option>
                        </select>
                    </div>
                    <div class="d-flex mb-2">
                        <label for="amplifier" class="col-sm-4 col-form-label">Amplifier:</label>
                        <select id="amplifier" class="col-sm-8 col-form-select" aria-label="Amplifier">
                            <option>Unspecified</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="col-md-6 ms-auto">
                <figure>
                    <figcaption id="preview-caption"></figcaption>
                    <div id="preview-spinner" class="spinner-border d-none" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <a id="preview-link" target="_blank">
                        <img id="preview" />
                    </a>
                </figure>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <a id="export-svg" class="btn btn-outline-secondary btn-sm disabled" download="icon.svg">Export SVG</a>
                    <a id="export-png" class="btn btn-outline-secondary btn-sm disabled" download="icon.png">Export PNG</a>
                    <label for="export-size" class="ms-2 mb-0">Size:</label>
                    <select id="export-size" class="form-select form-select-sm w-auto">
                        <option value="256">256px</option>
                        <option value="512" selected>512px</option>
                        <option value="1024">1024px</option>
                        <option value="2048">2048px</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
